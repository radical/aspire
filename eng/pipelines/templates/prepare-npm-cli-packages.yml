parameters:
  - name: npmPackagesDir
    type: string
    default: ''
  - name: expectedVersion
    type: string
    default: ''
  - name: rid
    type: string
    default: 'linux-x64'
  - name: validationSummaryArtifactName
    type: string
    default: 'npm-validation-summary'
  # When true, the install test is allowed to run against just-built tarballs
  # without contacting the npm registry. PR builds set this to true; release
  # validation builds also set this to true. The variable exists so future
  # registry-resolution probes can be gated on it.
  - name: skipRegistryResolution
    type: boolean
    default: true

steps:
  - bash: |
      bash eng/scripts/prepare-npm-cli-packages.sh resolve-inputs \
        '${{ parameters.npmPackagesDir }}' \
        '${{ parameters.expectedVersion }}' \
        '${{ parameters.rid }}'
    displayName: 🟣Resolve npm install-test inputs

  - bash: |
      bash eng/scripts/prepare-npm-cli-packages.sh locate \
        '$(NpmPackagesDir)' \
        '$(NpmExpectedVersion)' \
        '$(NpmTestRid)'
    displayName: 🟣Locate pointer and RID tarballs

  - bash: |
      bash eng/scripts/prepare-npm-cli-packages.sh install-validate \
        '$(NpmPointerTarball)' \
        '$(NpmRidTarball)' \
        '$(NpmExpectedVersion)' \
        '$(NpmTestRid)' \
        '$(Build.StagingDirectory)'
    displayName: 🟣Install, verify, and uninstall @microsoft/aspire-cli

  - bash: |
      bash eng/scripts/prepare-npm-cli-packages.sh write-summary \
        '$(Build.StagingDirectory)' \
        '$(NpmTestRid)' \
        '$(NpmExpectedVersion)' \
        '${{ parameters.skipRegistryResolution }}' \
        '$(NpmCheckInstall)' \
        '$(NpmCheckVersion)' \
        '$(NpmCheckLauncher)' \
        '$(NpmCheckUninstall)'
    displayName: 🟣Write npm validation summary
    condition: always()

  - task: 1ES.PublishBuildArtifacts@1
    displayName: 🟣Publish npm validation summary
    condition: always()
    inputs:
      PathtoPublish: '$(Build.StagingDirectory)/npm-validation-summary'
      ArtifactName: ${{ parameters.validationSummaryArtifactName }}
