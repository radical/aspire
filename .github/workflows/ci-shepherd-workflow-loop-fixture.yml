name: CI shepherd workflow loop fixture

on:
  push:
    branches:
      - ci-shepherd-validation/**
  pull_request:
    branches:
      - ci-shepherd-validation/**
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  repair-target:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'fixture:skip')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run controlled fixture
        shell: bash
        run: bash .github/ci-shepherd-fixture/run.sh
