name: Shepherd integration pilot 20260909

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-shepherd-pilot-20260909.yml
      - eng/ci-shepherd-pilot-20260909/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    if: github.repository == 'radical/aspire'
    name: Compiler fixture (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile deliberately invalid initializer
        run: dotnet build eng/ci-shepherd-pilot-20260909/Fixture.csproj --nologo -v:minimal

  setup:
    if: github.repository == 'radical/aspire'
    name: Dependency setup fixture (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dependency setup connection failure
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          url = "http://127.0.0.1:9/shepherd-fixture/Foo"
          try:
              urllib.request.urlopen(url, timeout=2)
          except urllib.error.URLError as error:
              print(f"Dependency setup for {url} failed: {error}", flush=True)
              raise
          raise RuntimeError("Fixture expected port 9 to refuse the connection")
          PY

  assertion:
    if: github.repository == 'radical/aspire'
    name: Tests / Fixture.Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run actual failing unittest and export its result
        run: python3 eng/ci-shepherd-pilot-20260909/assertion_fixture.py
      - name: Publish actual test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Fixture-TestResults
          path: test-artifacts
          retention-days: 1

  harness:
    if: github.repository == 'radical/aspire'
    name: Harness timeout fixture (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce a real harness timeout before assertions
        run: timeout 1s python3 -c 'import time; print("Harness timeout fixture; no tests have started", flush=True); time.sleep(30)'

  final:
    if: always() && github.repository == 'radical/aspire'
    name: Final Test Results
    runs-on: ubuntu-latest
    needs: [compiler, setup, assertion, harness]
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Fixture-TestResults
          path: test-artifacts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: All-TestResults
          path: test-artifacts
          retention-days: 1
