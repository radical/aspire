name: Enrolled-source SDK prerequisite proof (fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-prerequisite:
    if: github.repository == 'radical/aspire'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the exact enrolled-source SDK without enabling candidate execution
        run: python3 .github/scripts/sdk_prerequisite_probe.py --output "$RUNNER_TEMP/sdk-prerequisite"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sdk-prerequisite-proof
          path: ${{ runner.temp }}/sdk-prerequisite
          if-no-files-found: error
