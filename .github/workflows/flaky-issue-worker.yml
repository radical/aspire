name: Candidate boundary proof (fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    if: github.repository == 'radical/aspire'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove host isolation, hung descendant cleanup and fresh-process recovery
        run: python3 .github/scripts/isolation_probe.py --output "$RUNNER_TEMP/boundary-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-boundary-proof
          path: ${{ runner.temp }}/boundary-evidence
          if-no-files-found: error
