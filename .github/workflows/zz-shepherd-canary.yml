name: ZZ Shepherd Canary

# Temporary fixture for CI shepherd fork validation. Intentionally invalid so
# GitHub concludes the run as startup_failure before creating any job, which is
# the jobless-failure case the tracker-only settlement must handle.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: this-is-not-a-mapping
