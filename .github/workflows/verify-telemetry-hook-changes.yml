name: Verify Telemetry Hook Changes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  verify:
    name: Telemetry hook update branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Compare the PR merge result with its base parent, including renamed/deleted scripts.
          fetch-depth: 2
          persist-credentials: false

      - name: Check out telemetry policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .telemetry-policy
          sparse-checkout: |
            .github/workflows/verify-telemetry-hook-changes/verify-telemetry-hook-changes.ps1
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify telemetry scripts use the synchronization branch
        shell: pwsh
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: '& "${{ github.workspace }}/.telemetry-policy/.github/workflows/verify-telemetry-hook-changes/verify-telemetry-hook-changes.ps1"'
