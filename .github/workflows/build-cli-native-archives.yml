name: Build native CLI archives

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Validate retained payloads from approved run 38630516871 without rebuilding native packages'
        type: string
        default: ''
      configuration:
        type: choice
        options: [Release]
        default: Release
      versionOverrideArg:
        type: string
        default: ''
      targets:
        type: string
        default: >-
          [
            {"os":"windows-latest","runner":"windows-latest","rids":"win-x64","variant":"baseline","reuseDashboard":false},
            {"os":"windows-latest","runner":"windows-latest","rids":"win-x64","variant":"candidate","reuseDashboard":true},
            {"os":"windows-latest","runner":"windows-11-vs2026-arm","rids":"win-arm64","variant":"baseline","reuseDashboard":false},
            {"os":"windows-latest","runner":"windows-11-vs2026-arm","rids":"win-arm64","variant":"candidate","reuseDashboard":true}
          ]
  workflow_call:
    inputs:
      versionOverrideArg:
        required: false
        type: string
      configuration:
        required: false
        type: string
        default: Release
      targets:
        description: >
          JSON array of target objects to build. Each object must have 'os', 'runner', and 'rids' keys.
          Defaults to all platforms (linux-x64, linux-arm64, win-x64, win-arm64, osx-arm64).
        required: false
        type: string
        # Use the VS 2026 ARM preview image for its newer native linker. The VS 2022 ARM image
        # fails to link Aspire.Dashboard.obj with LNK1322.
        default: >-
          [
            {"os": "ubuntu-latest", "runner": "8-core-ubuntu-latest", "rids": "linux-x64"},
            {"os": "ubuntu-latest", "runner": "ubuntu-24.04-arm", "rids": "linux-arm64"},
            {"os": "windows-latest", "runner": "windows-latest", "rids": "win-x64"},
            {"os": "windows-latest", "runner": "windows-11-vs2026-arm", "rids": "win-arm64"},
            {"os": "macos-latest", "runner": "macos-latest", "rids": "osx-arm64"}
          ]

permissions:
  contents: read
  actions: read

jobs:

  build_cli_archives:
    if: ${{ !inputs.previous_run_id }}
    name: Build CLI (${{ matrix.targets.rids }} ${{ matrix.targets.variant }})
    runs-on: ${{ matrix.targets.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJson(inputs.targets) }}
    # Compute the Aspire CLI channel from the triggering GH Actions event,
    # mirroring the algorithm in eng/pipelines/templates/build_sign_native.yml
    # (computeCliChannel step):
    #   pull_request          -> pr-<PR_NUMBER>
    #   refs/heads/release/*  -> staging
    #   refs/heads/internal/release/* -> staging
    #   refs/heads/main      -> local
    #   anything else (schedule, workflow_dispatch on other refs) -> daily
    # The AzDO 'stable' branch (DotNetFinalVersionKind == 'release') is
    # intentionally omitted: stable archives are produced only by the AzDO
    # release pipeline, never by GH Actions.
    # For PR builds we bake the resolved hive label directly (pr-<N>) so the
    # CLI's IdentityChannelReader can return the channel verbatim, with no
    # separate parse of the version suffix at runtime.
    env:
      ASPIRE_CLI_CHANNEL: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/internal/release/')) && 'staging' || github.ref == 'refs/heads/main' && 'local' || 'daily' }}
      ARTIFACT_SUFFIX: ${{ matrix.targets.variant && format('-{0}', matrix.targets.variant) || '' }}

    steps:
      - name: Configure NuGet package cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages" >> $env:GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check controlled experiment identity
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git --no-pager merge-base --is-ancestor d751daa037a850428cd12ebf1efe309a8690df10 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Experiment must be based on the measured source SHA.' }
          $expected = if ('${{ matrix.targets.rids }}' -eq 'win-arm64') { 'Arm64' } else { 'X64' }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne $expected) {
            throw "Expected a native $expected Windows runner."
          }
          if (Test-Path artifacts/bin/Aspire.Dashboard) { throw 'Experiment must start without Dashboard outputs.' }
          # Keep experiment scratch/compiler files inside the workspace.
          $scratch = Join-Path '${{ github.workspace }}' 'artifacts/experiment-scratch'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$scratch" >> $env:GITHUB_ENV }

      # Node.js is required because PackDotnetTool now depends on PackNpmPackage,
      # which shells out to `npm pack` to produce the @microsoft/aspire-cli npm
      # tarballs alongside the existing dotnet tool packages. GitHub-hosted
      # runners ship Node by default, but installing it explicitly pins the
      # version and avoids relying on the runner image.
      - name: Install node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      # Build RID-specific NuGet packages (DCP + Dashboard) locally instead of
      # downloading them from the build_packages job. This allows the CLI archive
      # build to run in parallel with build_packages.
      #
      # Capture the complete build output so the expected framework-owned IL2026
      # can remain visible while verification rejects any additional IL2026 warnings.
      - name: Build RID-specific packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildLog = '${{ github.workspace }}/artifacts/log/${{ inputs.configuration }}/BuildBundleDeps.log'
          # Repository cleanup can remove artifacts/log while the build is streaming output.
          $temporaryLog = Join-Path '${{ runner.temp }}' 'BuildBundleDeps.log'
          & '${{ runner.os == 'Windows' && './build.cmd' || './build.sh' }}' `
            -ci `
            -restore `
            -build `
            -pack `
            -configuration '${{ inputs.configuration }}' `
            '/bl:${{ github.workspace }}/artifacts/log/${{ inputs.configuration }}/BuildBundleDeps.binlog' `
            /p:ContinuousIntegrationBuild=true `
            /p:BuildBundleDepsOnly=true `
            /p:TargetRids=${{ matrix.targets.rids }} `
            /p:AspireCliChannel=${{ env.ASPIRE_CLI_CHANNEL }} `
            ${{ inputs.versionOverrideArg }} 2>&1 | Tee-Object -FilePath $temporaryLog
          $buildExitCode = $LASTEXITCODE
          New-Item -ItemType Directory -Force -Path (Split-Path $buildLog -Parent) | Out-Null
          Copy-Item -LiteralPath $temporaryLog -Destination $buildLog
          exit $buildExitCode

      - name: Verify Native AOT Dashboard warnings
        shell: pwsh
        run: >
          ./eng/scripts/verify-native-dashboard-warnings.ps1
          -BuildLog "${{ github.workspace }}/artifacts/log/${{ inputs.configuration }}/BuildBundleDeps.log"

      - name: Capture first Dashboard publish and test missing-output guard
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Capture -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}' -Reuse:${{ matrix.targets.reuseDashboard && '$true' || '$false' }}
          ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Guard -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}'

      - name: Build bundle payload archive
        # SkipNativeBuild skips only the outer CLI. Bundle.proj still publishes
        # native tray payloads on Windows/macOS and verifies the actual archive.
        run: >
          ${{ runner.os == 'Windows' && './dotnet.cmd' || './dotnet.sh' }}
          msbuild
          eng/Bundle.proj
          /restore
          /p:Configuration=${{ inputs.configuration }}
          /p:TargetRid=${{ matrix.targets.rids }}
          /p:BundleVersion=ci-bundlepayload
          /p:SkipNativeBuild=true
          /p:ReuseDashboardPublish=${{ matrix.targets.reuseDashboard && 'true' || 'false' }}
          /p:ContinuousIntegrationBuild=true
          /bl:${{ github.workspace }}/artifacts/log/${{ inputs.configuration }}/BundlePayload.binlog
          ${{ inputs.versionOverrideArg }}

      - name: Smoke test bundled Native AOT TerminalHost
        if: ${{ !contains(matrix.targets.rids, 'musl') && ((runner.arch == 'ARM64' && endsWith(matrix.targets.rids, 'arm64')) || (runner.arch == 'X64' && endsWith(matrix.targets.rids, 'x64'))) }}
        shell: pwsh
        run: >
          ./eng/scripts/test-native-terminalhost.ps1
          -TerminalHostPath "${{ github.workspace }}/artifacts/bundle/${{ matrix.targets.rids }}/terminalhost/Aspire.TerminalHost${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Build CLI packages
        run: >
          ${{ runner.os == 'Windows' && './build.cmd' || './build.sh' }}
          -ci
          -build
          -pack
          -restore
          -configuration ${{ inputs.configuration }}
          /bl:${{ github.workspace }}/artifacts/log/${{ inputs.configuration }}/BuildCli.binlog
          /p:ContinuousIntegrationBuild=true
          /p:SkipManagedBuild=true
          /p:TargetRids=${{ matrix.targets.rids }}
          /p:BundlePayloadPath=${{ github.workspace }}/artifacts/bundle/aspire-ci-bundlepayload-${{ matrix.targets.rids }}.tar.gz
          /p:AspireCliChannel=${{ env.ASPIRE_CLI_CHANNEL }}
          ${{ inputs.versionOverrideArg }}

      - name: Verify CLI tool nupkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rid = '${{ matrix.targets.rids }}'
          $archiveExtension = if ($rid.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $archive = @(Get-ChildItem -Path 'artifacts/packages/${{ inputs.configuration }}' -Filter "aspire-cli-$rid-*.$archiveExtension" -Recurse -File -ErrorAction SilentlyContinue)
          if ($archive.Count -ne 1) {
            throw "Expected exactly one CLI archive for $rid, but found $($archive.Count): $($archive.FullName -join ', ')"
          }

          eng/scripts/verify-cli-tool-nupkg.ps1 `
            -PackagesDir artifacts/packages/${{ inputs.configuration }} `
            -Rid $rid `
            -ArchivePath $archive[0].FullName

      - name: Check Windows tray desktop availability
        id: windows_tray_desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session })
          $available = [Environment]::UserInteractive -and $session -ne 0 -and $explorer.Count -gt 0
          if ($available) {
            # Explorer in another desktop or a locked input desktop cannot support modal UI smoke.
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class AspireTrayDesktopProbe
          {
              [DllImport("user32.dll", EntryPoint = "FindWindowW", CharSet = CharSet.Unicode)]
              private static extern IntPtr FindWindow(string className, string windowName);
              [DllImport("user32.dll")]
              private static extern IntPtr OpenInputDesktop(uint flags, [MarshalAs(UnmanagedType.Bool)] bool inherit, uint access);
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool CloseDesktop(IntPtr desktop);
              public static bool IsAvailable()
              {
                  if (FindWindow("Shell_TrayWnd", null) == IntPtr.Zero) return false;
                  var desktop = OpenInputDesktop(0, false, 0x0001);
                  return desktop != IntPtr.Zero && CloseDesktop(desktop);
              }
          }
          '@
            $available = [AspireTrayDesktopProbe]::IsAvailable()
          }
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            $notice = 'Windows native tray smoke was not run: an interactive Explorer/input desktop is unavailable. Native publishing and payload verification remain enabled; validate UI on a Windows desktop.'
            Write-Output "::warning::$notice"
            "### Windows tray UI validation`n`n$notice" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Report skipped Windows ARM64 tray smoke
        if: runner.os == 'Windows' && matrix.targets.rids == 'win-arm64'
        shell: pwsh
        run: |
          $notice = 'Windows ARM64 native tray UI smoke is temporarily disabled on GitHub-hosted runners: notification icon registration fails in native ARM64 and emulated x64 SDK controls despite a responsive Explorer. The root cause remains unresolved. Native publishing and payload verification remain enabled; native UI behavior is not validated by this job.'
          Write-Output "::warning::$notice"
          "### Windows ARM64 tray UI validation`n`n$notice" >> $env:GITHUB_STEP_SUMMARY

      # Temporarily disabled on Windows ARM64 GitHub-hosted runners: notification icon
      # registration fails for both native ARM64 and emulated x64 SDK controls even
      # with a responsive Explorer. Root cause remains unresolved.
      # Native publishing and payload verification still run.
      # https://github.com/microsoft/aspire/actions/runs/35373950404/job/105696457894
      - name: Smoke Windows native tray
        if: runner.os == 'Windows' && matrix.targets.rids != 'win-arm64' && steps.windows_tray_desktop.outputs.available == 'true'
        shell: pwsh
        env:
          TRAY_RID: ${{ matrix.targets.rids }}
          TRAY_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = $env:TRAY_RID
          $archive = @(Get-ChildItem -Path "artifacts/packages/$env:TRAY_CONFIGURATION" -Filter "aspire-cli-$rid-*.zip" -Recurse -File)
          if ($archive.Count -ne 1) {
            throw "Expected exactly one native CLI archive for $rid."
          }
          $scratch = [IO.Directory]::CreateTempSubdirectory('aspire-tray-ci-').FullName
          try {
            eng/scripts/tray-registration-control/run.ps1 -Architecture ($rid -replace '^win-', '') -CompareArchitectures:($rid -eq 'win-arm64')
            Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath (Join-Path $scratch 'cli')
            $cli = Join-Path $scratch 'cli/aspire.exe'
            & tar -xzf "artifacts/bundle/aspire-ci-bundlepayload-$rid.tar.gz" -C $scratch "$rid/tray"
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract native tray smoke payload.' }
            src/Aspire.Tray/Windows/publish.ps1 `
              -Architecture ($rid -replace '^win-', '') `
              -Configuration $env:TRAY_CONFIGURATION `
              -PublishDirectory (Join-Path $scratch "$rid/tray") `
              -SkipPublish -CliPath $cli -SmokeSeconds 60
          }
          finally {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }

      - name: Verify CLI npm package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rid = '${{ matrix.targets.rids }}'
          $archiveExtension = if ($rid.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $archive = @(Get-ChildItem -Path 'artifacts/packages/${{ inputs.configuration }}' -Filter "aspire-cli-$rid-*.$archiveExtension" -Recurse -File -ErrorAction SilentlyContinue)
          if ($archive.Count -ne 1) {
            throw "Expected exactly one CLI archive for $rid, but found $($archive.Count): $($archive.FullName -join ', ')"
          }

          eng/scripts/verify-cli-npm-package.ps1 `
            -PackagesDir artifacts/packages/${{ inputs.configuration }} `
            -Rid $rid `
            -ArchivePath $archive[0].FullName

      - name: Verify reused output and extract actual bundle for Dashboard tests
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
            ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Verify -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}' -Reuse:${{ matrix.targets.reuseDashboard && '$true' || '$false' }}
            $log = 'artifacts/log/${{ inputs.configuration }}'
            ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/BuildBundleDeps.binlog" "/p:Report=$log/first-dashboard-compiler-tasks.txt" /p:ExpectDashboardCompiler=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ('${{ matrix.targets.reuseDashboard }}' -eq 'true') {
              if (Test-Path "$log/PublishDashboard.binlog") { throw 'Candidate produced a second Dashboard publish binlog.' }
              ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/BundlePayload.binlog" "/p:Report=$log/dashboard-compiler-tasks.txt" /p:ExpectDashboardCompiler=false
            }
            else {
              ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/PublishDashboard.binlog" "/p:Report=$log/dashboard-compiler-tasks.txt" /p:ExpectDashboardCompiler=true
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bundled native Dashboard HTTP assets SQLite and telemetry
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Smoke -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}'

      - name: Test Dashboard regular suite
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
            ./dotnet.cmd test --project tests/Aspire.Dashboard.Tests/Aspire.Dashboard.Tests.csproj -c Release --no-launch-profile /p:ContinuousIntegrationBuild=true -- --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test actual bundled native Dashboard browser interactivity
        if: github.event_name == 'workflow_dispatch' && matrix.targets.rids == 'win-x64'
        shell: pwsh
        run: |
            ./dotnet.cmd test --project tests/Aspire.Dashboard.Playwright.Tests/Aspire.Dashboard.Playwright.Tests.csproj -c Release --no-launch-profile /p:ContinuousIntegrationBuild=true /p:InstallBrowsersForPlaywright=true /p:RunOuterloopTests=true -- --filter-method "*.NativeDashboard_LoadsInteractivePageWithoutBrowserErrors" --filter-not-trait "quarantined=true" --report-trx --report-trx-filename dashboard-reuse-native.trx
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $reports = @(Get-ChildItem artifacts -Recurse -File -Filter dashboard-reuse-native.trx)
            if ($reports.Count -ne 1) { throw "Expected exactly one native browser test report, found $($reports.Count)." }
            [xml]$report = Get-Content $reports[0].FullName
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.total -ne '1' -or $counts.passed -ne '1' -or $counts.executed -ne '1' -or $counts.failed -ne '0') {
              throw 'Expected exactly one passed native browser test, with no skips or failures.'
            }

      - name: Upload Dashboard reuse evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: dashboard-reuse-evidence-${{ matrix.targets.rids }}${{ env.ARTIFACT_SUFFIX }}
            path: |
              artifacts/log/dashboard-reuse/*.json
              artifacts/log/dashboard-reuse/*.log
              artifacts/log/dashboard-reuse/native-smoke/
              artifacts/bundle/aspire-ci-bundlepayload-${{ matrix.targets.rids }}.tar.gz
              artifacts/TestResults/
            if-no-files-found: error
            retention-days: 7

      # Upload DCP, Dashboard, and CLI tool packages so test/polyglot jobs can download them
      - name: Upload RID-specific packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-nugets-for-${{ matrix.targets.rids }}${{ env.ARTIFACT_SUFFIX }}
          path: |
            artifacts/packages/${{ inputs.configuration }}/Shipping/Aspire.Hosting.Orchestration.${{ matrix.targets.rids }}.*.nupkg
            artifacts/packages/${{ inputs.configuration }}/Shipping/Aspire.Dashboard.Sdk.${{ matrix.targets.rids }}.*.nupkg
            artifacts/packages/${{ inputs.configuration }}/Shipping/Aspire.Cli.*.nupkg
            artifacts/packages/${{ inputs.configuration }}/Shipping/microsoft-aspire-cli*.tgz
          if-no-files-found: error
          retention-days: 15

      - name: Upload CLI archives
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-native-archives-${{ matrix.targets.rids }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/packages/**/aspire-cli*
          retention-days: 15
          if-no-files-found: error

      - name: Upload Native AOT Dashboard archive
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dashboard-${{ matrix.targets.rids }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/DashboardArtifacts/${{ inputs.configuration }}/${{ matrix.targets.rids }}/aspire-dashboard-${{ matrix.targets.rids }}.zip
          retention-days: 15
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-native-logs-${{ matrix.targets.rids }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/log/**

  validate_saved_dashboard:
    if: github.event_name == 'workflow_dispatch' && inputs.previous_run_id != ''
    name: Validate saved Dashboard (${{ matrix.targets.rids }} ${{ matrix.targets.variant }})
    runs-on: ${{ matrix.targets.runner }}
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify original artifact run identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.previous_run_id }}' -ne '38630516871') {
            throw 'Only approved original experiment run 38630516871 can be reused.'
          }
          $source = gh api 'repos/${{ github.repository }}/actions/runs/${{ inputs.previous_run_id }}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $source.head_sha -ne 'b4e053c2be8049823cf96303882d3360a3c30ebc' -or $source.status -ne 'completed') {
            throw 'Original artifact run is unavailable or has a different source identity.'
          }
      - name: Download original payload and content evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-reuse-evidence-${{ matrix.targets.rids }}-${{ matrix.targets.variant }}
          path: artifacts
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
      - name: Download original build binlogs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-logs-${{ matrix.targets.rids }}-${{ matrix.targets.variant }}
          path: artifacts/log
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
      - name: Restore repository toolchain
        shell: pwsh
        run: |
          ./restore.cmd -ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original payload and compiler execution
        shell: pwsh
        run: |
          ./eng/scripts/validate-dashboard-reuse.ps1 -Stage VerifySaved -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}' -Reuse:${{ matrix.targets.reuseDashboard && '$true' || '$false' }}
          $log = 'artifacts/log/${{ inputs.configuration }}'
          ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/BuildBundleDeps.binlog" "/p:Report=$log/first-dashboard-compiler-tasks.txt" /p:ExpectDashboardCompiler=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Baseline parent binlogs record the child publish command, not its Csc/ILC events.
          # Record comparable parent elapsed time, then verify the actual baseline child below.
          ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/BundlePayload.binlog" "/p:Report=$log/bundle-payload-tasks.txt" /p:ExpectDashboardCompiler=false /p:RecordOnly=${{ matrix.targets.reuseDashboard && 'false' || 'true' }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.targets.reuseDashboard }}' -eq 'true') {
            if (Test-Path "$log/PublishDashboard.binlog") { throw 'Candidate produced a second Dashboard publish binlog.' }
          }
          else {
            ./dotnet.cmd msbuild eng/scripts/dashboard-reuse-binlog.proj "/p:Binlog=$log/PublishDashboard.binlog" "/p:Report=$log/dashboard-compiler-tasks.txt" /p:ExpectDashboardCompiler=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test original bundled native Dashboard HTTP assets SQLite and telemetry
        shell: pwsh
        run: ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Smoke -Rid '${{ matrix.targets.rids }}' -Configuration '${{ inputs.configuration }}'
      - name: Test Dashboard regular suite
        shell: pwsh
        run: |
          ./dotnet.cmd test --project tests/Aspire.Dashboard.Tests/Aspire.Dashboard.Tests.csproj -c Release --no-launch-profile /p:ContinuousIntegrationBuild=true -- --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test original bundled native Dashboard browser interactivity
        if: matrix.targets.rids == 'win-x64'
        shell: pwsh
        run: |
          ./dotnet.cmd test --project tests/Aspire.Dashboard.Playwright.Tests/Aspire.Dashboard.Playwright.Tests.csproj -c Release --no-launch-profile /p:ContinuousIntegrationBuild=true /p:InstallBrowsersForPlaywright=true /p:RunOuterloopTests=true -- --filter-method "*.NativeDashboard_LoadsInteractivePageWithoutBrowserErrors" --filter-not-trait "quarantined=true" --report-trx --report-trx-filename dashboard-reuse-native.trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem artifacts -Recurse -File -Filter dashboard-reuse-native.trx)
          if ($reports.Count -ne 1) { throw "Expected exactly one native browser test report, found $($reports.Count)." }
          [xml]$report = Get-Content $reports[0].FullName
          $counts = $report.TestRun.ResultSummary.Counters
          if ($counts.total -ne '1' -or $counts.passed -ne '1' -or $counts.executed -ne '1' -or $counts.failed -ne '0') {
            throw 'Expected exactly one passed native browser test, with no skips or failures.'
          }
      - name: Upload original payload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-reuse-evidence-${{ matrix.targets.rids }}-${{ matrix.targets.variant }}
          path: |
            artifacts/log/dashboard-reuse/*.json
            artifacts/log/dashboard-reuse/*.log
            artifacts/log/dashboard-reuse/native-smoke/
            artifacts/log/${{ inputs.configuration }}/*tasks.txt
            artifacts/TestResults/
          if-no-files-found: error
          retention-days: 7

  compare_dashboard_reuse:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [build_cli_archives, validate_saved_dashboard]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dashboard-reuse-evidence-*
          path: artifacts/reuse-comparison
      - name: Compare baseline and candidate payload bytes
        shell: pwsh
        run: ./eng/scripts/validate-dashboard-reuse.ps1 -Stage Compare
      - name: Upload byte comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-reuse-byte-comparison
          path: artifacts/log/dashboard-reuse/
