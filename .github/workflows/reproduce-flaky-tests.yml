      run: |
        $ErrorActionPreference = 'Stop'
        $admittedInventory = Get-Content "$env:EVIDENCE/frozen-inventory.json" -Raw | ConvertFrom-Json
        if ($admittedInventory.inventory_authenticated -ne $true) { throw 'BLOCKED: unauthenticated arm inventory.' }
        $ErrorActionPreference = 'Stop'
        $frozen = Get-Content "$env:EVIDENCE/frozen-inventory.json" -Raw | ConvertFrom-Json
        $files = @(Get-ChildItem "$env:EVIDENCE/testresults" -Filter '*.trx' -Recurse)
        if ($files.Count -ne 1) { throw "Expected one ordinary-assembly TRX; found $($files.Count)." }
        [xml]$trx = Get-Content $files[0].FullName -Raw
        $ns = [System.Xml.XmlNamespaceManager]::new($trx.NameTable)
        $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
        $rows = @($trx.SelectNodes('/t:TestRun/t:Results/t:UnitTestResult', $ns))
        $definitions = @{}
        foreach ($definition in $trx.SelectNodes('/t:TestRun/t:TestDefinitions/t:UnitTest', $ns)) {
          if (!$definition.id -or $definitions.ContainsKey($definition.id)) { throw 'Duplicate or missing definition ID.' }
          $definitions[$definition.id] = $definition
        }
        $observed = [System.Collections.Generic.Dictionary[string,int]]::new([System.StringComparer]::Ordinal)
        $executionIds = @{}
        $inventory = @(
          foreach ($row in $rows) {
            if (!$definitions.ContainsKey($row.testId)) { throw 'Result has no test definition.' }
            $definition = $definitions[$row.testId]
            if (!$row.executionId -or $executionIds.ContainsKey($row.executionId) -or $definition.Execution.id -cne $row.executionId) {
              throw 'Duplicate, missing, or mismatched execution ID.'
            }
            $executionIds[$row.executionId] = $true
            if ($row.outcome -cnotin @('Passed', 'Failed')) { throw 'Skipped or nondefinitive result.' }
            $identity = @($definition.TestMethod.className, $definition.TestMethod.name, $row.testName) | ConvertTo-Json -Compress
            if (!$observed.ContainsKey($identity)) { $observed[$identity] = 0 }
            $observed[$identity]++
            @{
              class = $definition.TestMethod.className
              method = $definition.TestMethod.name
              test_name = $row.testName
              id = $row.testId
              executionId = $row.executionId
              outcome = $row.outcome
              startedAt = $row.startTime
              endedAt = $row.endTime
            }
          }
        )
        $expected = [System.Collections.Generic.Dictionary[string,int]]::new([System.StringComparer]::Ordinal)
        foreach ($item in $frozen.common_suite) {
          $identity = @($item.class, $item.method, $item.test_name) | ConvertTo-Json -Compress
          if ($expected.ContainsKey($identity) -or $item.multiplicity -lt 1) { throw 'Invalid frozen identity.' }
          $expected[$identity] = [int]$item.multiplicity
        }
        if ($observed.Count -ne $expected.Count -or $rows.Count -ne $frozen.expected_results) { throw 'Full inventory differs.' }
        foreach ($identity in $expected.Keys) {
          if (!$observed.ContainsKey($identity) -or $observed[$identity] -ne $expected[$identity]) { throw "Inventory mismatch: $identity" }
        }
        foreach ($target in $frozen.targets) {
          $matches = @($rows | Where-Object { $_.testName -ceq $target })
          if ($matches.Count -ne 1 -or $matches[0].outcome -cnotin @('Passed', 'Failed')) { throw "Invalid target: $target" }
        }
        $counterNodes = @($trx.SelectNodes('/t:TestRun/t:ResultSummary/t:Counters', $ns))
        if ($counterNodes.Count -ne 1) { throw 'Missing or duplicate counters.' }
        $counters = @{}
        foreach ($attribute in $counterNodes[0].Attributes) {
          if ($attribute.Value -cnotmatch '^\d+$') { throw 'Invalid counter value.' }
          $counters[$attribute.Name] = [int]$attribute.Value
        }
        $passed = @($rows | Where-Object outcome -CEQ 'Passed').Count
        $failed = @($rows | Where-Object outcome -CEQ 'Failed').Count
        $required = @{ total = $rows.Count; executed = $rows.Count; passed = $passed; failed = $failed
          error = 0; timeout = 0; aborted = 0; inconclusive = 0; passedButRunAborted = 0
          notRunnable = 0; notExecuted = 0; disconnected = 0; warning = 0; completed = 0; inProgress = 0; pending = 0 }
        foreach ($key in $required.Keys) {
          if (!$counters.ContainsKey($key) -or $counters[$key] -ne $required[$key]) { throw "Absent or inconsistent counter: $key" }
        }
        foreach ($key in $counters.Keys) {
          if (!$required.ContainsKey($key) -and $counters[$key] -ne 0) { throw "Unknown nonzero counter: $key" }
        }
        $summary = $trx.SelectSingleNode('/t:TestRun/t:ResultSummary', $ns)
        if (($failed -gt 0 -and $summary.outcome -cne 'Failed') -or ($failed -eq 0 -and $summary.outcome -cne 'Completed')) {
          throw 'Contradictory result summary outcome.'
        }
        # MTP emits this exact RunInfo for ordinary failed rows, not a second fixture failure.
        # See https://learn.microsoft.com/en-us/dotnet/core/testing/microsoft-testing-platform-troubleshooting#exit-codes
        $normal = "Exit code indicates failure: '2'. Please refer to https://aka.ms/testingplatform/exitcodes for more information."
        $classified = @(
          foreach ($info in $trx.SelectNodes('//t:RunInfo', $ns)) {
            if ($info.outcome -cne 'Error' -or $info.Text -cne $normal -or $failed -eq 0) { throw 'Unexpected run-level information/error.' }
            $info.Text
          }
        )
        if (@($trx.SelectNodes('/t:TestRun/t:ResultSummary/t:Output/t:ErrorInfo', $ns)).Count -ne 0) { throw 'Run-level ErrorInfo exists.' }
        $execution = Get-Content "$env:EVIDENCE/execution.json" -Raw | ConvertFrom-Json
        if ($execution.source -cne $frozen.source -or $execution.plan -cne $frozen.plan_id -or $execution.invocations -ne 1 -or
            !$execution.startedAt -or !$execution.endedAt -or $null -eq $execution.exitCode) { throw 'Invalid single-execution receipt.' }
        if (($failed -eq 0 -and $execution.exitCode -ne 0) -or ($failed -gt 0 -and $execution.exitCode -notin @(1, 2))) {
          throw 'Test exit code contradicts original TRX results.'
        }
        $start = [DateTimeOffset]::Parse($execution.startedAt)
        $end = [DateTimeOffset]::Parse($execution.endedAt)
        $build = Get-Content "$env:EVIDENCE/build.json" -Raw | ConvertFrom-Json
        if ($start -gt $end -or $build.exitCode -ne 0 -or
            [DateTimeOffset]::Parse($build.startedAt) -gt [DateTimeOffset]::Parse($build.endedAt) -or
            [DateTimeOffset]::Parse($build.endedAt) -gt $start) { throw 'Invalid build/execution timing or build exit.' }
        $paths = Get-Content "$env:EVIDENCE/native-paths.json" -Raw | ConvertFrom-Json
        $certificate = Get-Content "$env:EVIDENCE/dev-certs.json" -Raw | ConvertFrom-Json
        $docker = Get-Content "$env:EVIDENCE/docker-info.json" -Raw | ConvertFrom-Json
        $diagnostics = Get-Content "$env:EVIDENCE/diagnostics.json" -Raw | ConvertFrom-Json
        if ($paths.githubPathAppended -ne $true -or !$paths.workspace -or
            $paths.dotnetScript -cne './dotnet.sh' -or $paths.buildScript -cne './build.sh' -or
            $paths.dotnetPath -cne "$($paths.workspace)/.dotnet" -or $paths.testRunPath -cne "$($paths.workspace)/run-tests") {
          throw 'Native Unix path setup is invalid.'
        }
        if ($null -eq $certificate.exitCode -or $certificate.exitCode -notin @(0, 4) -or $certificate.wslInterop -cne '') {
          throw 'Native Linux certificate setup is invalid.'
        }
        if ($null -eq $docker.exitCode -or $docker.exitCode -ne 0) { throw 'Native Docker setup failed.' }
        if ($null -eq $diagnostics.exitCode -or $diagnostics.exitCode -ne 0 -or $diagnostics.property -cne 'MtpBaseArgs' -or
            $diagnostics.value -cne $frozen.expected_mtp_base_args -or $execution.mtpBaseArgs -cne $diagnostics.value) {
          throw 'Native MTP diagnostic arguments differ.'
        }
        $previousEnd = $null
        foreach ($receipt in @($paths, $certificate, $docker, $build, $diagnostics)) {
          $receiptStart = [DateTimeOffset]::Parse($receipt.startedAt)
          $receiptEnd = [DateTimeOffset]::Parse($receipt.endedAt)
          if ($receiptStart -gt $receiptEnd -or ($null -ne $previousEnd -and $receiptStart -lt $previousEnd)) {
            throw 'Native setup/build/diagnostic timing is invalid.'
          }
          $previousEnd = $receiptEnd
        }
        if ($previousEnd -gt $start) { throw 'Native diagnostics were not resolved before suite invocation.' }
        foreach ($phase in @('before', 'after')) {
          $source = Get-Content "$env:EVIDENCE/source-$phase.json" -Raw | ConvertFrom-Json
          if ($source.head -cne $frozen.source -or $source.tree -cne $frozen.source_tree -or @($source.status).Count -ne 0) {
            throw "Source mismatch: $phase"
          }
          $recorded = [DateTimeOffset]::Parse($source.recordedAt)
          if (($phase -eq 'before' -and $recorded -gt [DateTimeOffset]::Parse($certificate.startedAt)) -or
              ($phase -eq 'after' -and $recorded -lt $end)) { throw "Source timestamp mismatch: $phase" }
        }
        @{ valid = $true; rows = $rows.Count; passed = $passed; failed = $failed; inventory = $inventory
          counters = $counters; classifiedRunInfos = $classified } |
          ConvertTo-Json -Depth 10 | Set-Content "$env:EVIDENCE/guard.json"
        Write-Host "VALID: $($rows.Count) frozen baseline identities; $passed passed, $failed failed; $($frozen.targets.Count) linked targets once each."
      if: always()
    - name: Preserve every opportunity, successful or failed
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr-21424-v18-baseline-ubuntu-${{ matrix.machine }}
        path: ${{ runner.temp }}/pr21424-v18-baseline-${{ matrix.machine }}/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
      if: always()
'on':
  workflow_dispatch:
    inputs:
      dispatched_at:
        description: Trusted operator UTC dispatch receipt; must precede 01:00Z
        required: true
        type: string
