name: Selected Sol provider diagnostic (no inference)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  provider_diagnostic:
    if: ${{ github.repository == 'radical/aspire' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      copilot-requests: write
    env:
      GH_AW_OTLP_ENDPOINTS: ''
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      OTEL_EXPORTER_OTLP_HEADERS: ''
    steps:
    - name: Reject existing snapshot before frozen setup can clean its runtime tree
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import os
        path = Path('/tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs')
        for component in (*reversed(path.parents), path):
            if component.is_symlink():
                raise SystemExit('snapshot-unsafe')
        if os.path.lexists(path / 'models.json') or (path.exists() and any(path.iterdir())):
            raise SystemExit('snapshot-preexisting')
        PY
    - name: Setup Scripts
      id: setup
      uses: github/gh-aw-actions/setup@f3b81cdb3070066a47faa9bdf440f4f1dc78b1f0
      with:
        destination: ${{ runner.temp }}/gh-aw/actions
        job-name: ${{ github.job }}
      env:
        GH_AW_SETUP_WORKFLOW_NAME: Selected Sol provider diagnostic
        GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/reproduce-flaky-tests.yml@${{ github.ref }}
        GH_AW_INFO_VERSION: 1.0.85
        GH_AW_INFO_AWF_VERSION: v0.28.20
        GH_AW_INFO_ENGINE_ID: copilot
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Initialize owned private host state
      shell: bash
      run: |
        set -euo pipefail
        install -d -m 700 "${RUNNER_TEMP}/provider-diagnostic-v2"
        install -d -m 700 "${RUNNER_TEMP}/gh-aw/safeoutputs/upload-artifacts"
        mkdir -p /tmp/gh-aw
        test -n "${RUNNER_TOOL_CACHE}"
    - name: Install GitHub Copilot CLI
      run: |
        set -euo pipefail
        { bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh" 1.0.85; } >> "${RUNNER_TEMP}/provider-diagnostic-v2/private-setup.log" 2>&1
      env:
        GH_HOST: github.com
        GH_AW_COMPILED_VERSION: v0.89.17
    - name: Install AWF binary
      run: |
        set -euo pipefail
        { bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.20 --rootless; } >> "${RUNNER_TEMP}/provider-diagnostic-v2/private-setup.log" 2>&1
    - name: Download container images
      run: |
        set -euo pipefail
        { bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.28.20@sha256:1bacef0f405d77999d01d8c00cb731222531b3f43ef9dc8312c513d6d9038bb1 ghcr.io/github/gh-aw-firewall/api-proxy:0.28.20@sha256:30ab6d3261dd95364281fa0b52ab78450e1c01aa074eccc3a8d4f04b12a6560b ghcr.io/github/gh-aw-firewall/squid:0.28.20@sha256:cba5f56857e4869c4a00c1cce29c3056516cf1a746e18ce380753ecfbe40f112 ghcr.io/github/gh-aw-mcpg:v0.4.25@sha256:9be0a86220e807a0ecc89e53d7453468f7a53fbc6b3d1efd2299025ffe01d086 ghcr.io/github/gh-aw-node@sha256:0daa8971fa4732b647150cb6524a6b0804b68d5d24f6f58b5dd1af23bd63fb23 ghcr.io/github/github-mcp-server:v1.12.1@sha256:0ba840c46a237879c8300e7fddb0b6347f20e029ccb9cbe2ce4a943daa1ff560; } >> "${RUNNER_TEMP}/provider-diagnostic-v2/private-setup.log" 2>&1
    - name: Start frozen topology peer without tool servers
      id: start-mcp-gateway
      run: |
        set -euo pipefail
        {
        set -eo pipefail
        mkdir -p "${RUNNER_TEMP}/gh-aw/mcp-config"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -r "${GITHUB_EVENT_PATH}" ]; then
          GH_AW_SAFEOUTPUTS_EVENT_PATH="${RUNNER_TEMP}/gh-aw/safeoutputs/github_event.json"
          cp "${GITHUB_EVENT_PATH}" "${GH_AW_SAFEOUTPUTS_EVENT_PATH}"
          export GITHUB_EVENT_PATH="${GH_AW_SAFEOUTPUTS_EVENT_PATH}"
        fi

        # Export gateway environment variables for MCP config and gateway script
        export MCP_GATEWAY_PORT="8080"
        export MCP_GATEWAY_DOMAIN="awmg-mcpg"
        export MCP_GATEWAY_HOST_DOMAIN="localhost"
        MCP_GATEWAY_AGENT_ID=$(openssl rand -base64 45 | tr -d '/+=')
        echo "::add-mask::${MCP_GATEWAY_AGENT_ID}"
        export MCP_GATEWAY_AGENT_ID
        export MCP_GATEWAY_PAYLOAD_DIR="/tmp/gh-aw/mcp-payloads"
        mkdir -p "${MCP_GATEWAY_PAYLOAD_DIR}"
        export MCP_GATEWAY_PAYLOAD_SIZE_THRESHOLD="524288"
        export MCP_GATEWAY_ALLOWED_MOUNT_ROOTS="${GITHUB_WORKSPACE}:rw,${RUNNER_TEMP}/gh-aw:ro,${RUNNER_TEMP}/gh-aw/safeoutputs:rw,/opt:ro,/tmp:rw,/usr/bin/gh:ro"
        export GH_AW_PR_HEAD_BASE_BRANCH="${GH_AW_PR_HEAD_BASE_BRANCH:-}"
        export GH_AW_PR_HEAD_BASE_SHA="${GH_AW_PR_HEAD_BASE_SHA:-}"
        export GH_AW_PR_HEAD_BASE_REPO="${GH_AW_PR_HEAD_BASE_REPO:-}"
        export GH_AW_PR_HEAD_BASE_PR_NUMBER="${GH_AW_PR_HEAD_BASE_PR_NUMBER:-}"
        export GH_AW_PR_HEAD_BASE_REF="${GH_AW_PR_HEAD_BASE_REF:-}"
        export GH_AW_PR_HEAD_REPO="${GH_AW_PR_HEAD_REPO:-}"
        export DEBUG="*"

        export GH_AW_ENGINE="copilot"
        MCP_GATEWAY_UID=$(id -u 2>/dev/null || echo '0')
        MCP_GATEWAY_GID=$(id -g 2>/dev/null || echo '0')
        source "${RUNNER_TEMP}/gh-aw/actions/resolve_docker_socket_gid.sh"
        export MCP_GATEWAY_DOCKER_COMMAND='docker run -i --rm --network bridge -p 127.0.0.1:'"${MCP_GATEWAY_PORT}"':'"${MCP_GATEWAY_PORT}"' --name awmg-mcpg --add-host host.docker.internal:host-gateway --user '"${MCP_GATEWAY_UID}"':'"${MCP_GATEWAY_GID}"' --group-add '"${DOCKER_SOCK_GID}"' -v '"${DOCKER_SOCK_PATH}"':/var/run/docker.sock -e MCP_GATEWAY_PORT -e MCP_GATEWAY_DOMAIN -e MCP_GATEWAY_AGENT_ID -e MCP_GATEWAY_PAYLOAD_DIR -e MCP_GATEWAY_PAYLOAD_SIZE_THRESHOLD -e DOCKER_HOST=unix:///var/run/docker.sock -e DEBUG -e MCP_GATEWAY_LOG_DIR -e GH_AW_MCP_LOG_DIR -e GH_AW_SAFE_OUTPUTS -e GH_AW_SAFE_OUTPUTS_CONFIG_PATH -e GH_AW_SAFE_OUTPUTS_TOOLS_PATH -e GH_AW_PR_HEAD_BASE_BRANCH -e GH_AW_PR_HEAD_BASE_SHA -e GH_AW_PR_HEAD_BASE_REPO -e GH_AW_PR_HEAD_BASE_PR_NUMBER -e GH_AW_PR_HEAD_BASE_REF -e GH_AW_PR_HEAD_REPO -e GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST -e GH_AW_ASSETS_BRANCH -e GH_AW_ASSETS_MAX_SIZE_KB -e GH_AW_ASSETS_ALLOWED_EXTS -e DEFAULT_BRANCH -e GITHUB_MCP_SERVER_TOKEN -e GITHUB_MCP_GUARD_MIN_INTEGRITY -e GITHUB_MCP_GUARD_REPOS -e GH_AW_SINK_VISIBILITY -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA -e GITHUB_WORKSPACE -e GITHUB_TOKEN -e GITHUB_RUN_ID -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB -e GITHUB_ACTION -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH -e GITHUB_ACTOR -e GITHUB_ACTOR_ID -e GITHUB_TRIGGERING_ACTOR -e GITHUB_WORKFLOW -e GITHUB_WORKFLOW_REF -e GITHUB_WORKFLOW_SHA -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_REF_TYPE -e GITHUB_HEAD_REF -e GITHUB_BASE_REF -e RUNNER_TEMP -e RUNNER_TOOL_CACHE -e MCP_GATEWAY_ALLOWED_MOUNT_ROOTS -e GITHUB_AW_OTEL_TRACE_ID -e GITHUB_AW_OTEL_PARENT_SPAN_ID -e OTEL_EXPORTER_OTLP_HEADERS -v /tmp/gh-aw/mcp-payloads:/tmp/gh-aw/mcp-payloads:rw -v /opt:/opt:ro -v /tmp:/tmp:rw -v '"${GITHUB_WORKSPACE}"':'"${GITHUB_WORKSPACE}"':rw -v '"${RUNNER_TEMP}"'/gh-aw/safeoutputs:'"${RUNNER_TEMP}"'/gh-aw/safeoutputs:rw ghcr.io/github/gh-aw-mcpg:v0.4.25'

        mkdir -p "$HOME/.copilot"
        GH_AW_NODE=$(which node 2>/dev/null || command -v node 2>/dev/null || echo node)
        cat << GH_AW_MCP_CONFIG_8f01f8686b157b34_EOF | "$GH_AW_NODE" "${RUNNER_TEMP}/gh-aw/actions/start_mcp_gateway.cjs"
        {
          "mcpServers": {},
          "gateway": {
            "port": $MCP_GATEWAY_PORT,
            "domain": "${MCP_GATEWAY_DOMAIN}",
            "agentId": "${MCP_GATEWAY_AGENT_ID}",
            "payloadDir": "${MCP_GATEWAY_PAYLOAD_DIR}",
            "startupTimeout": 120,
            "opentelemetry": {
              "endpoint": "${OTEL_EXPORTER_OTLP_ENDPOINT}",
              "traceId": "${GITHUB_AW_OTEL_TRACE_ID}",
              "spanId": "${GITHUB_AW_OTEL_PARENT_SPAN_ID}"
            }
          }
        }
        GH_AW_MCP_CONFIG_8f01f8686b157b34_EOF

        } > "${RUNNER_TEMP}/provider-diagnostic-v2/private-gateway.log" 2>&1
    - name: Reject stale inputs and start credential-free host observer
      id: owned_start
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/provider_diagnostic_v2/provider_diagnostic.py prepare --logs /tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs --state "${RUNNER_TEMP}/provider-diagnostic-v2/intent.json" --receipt "${GITHUB_WORKSPACE}/provider-diagnostic-receipt.json"
        python3 .github/scripts/provider_diagnostic_v2/provider_diagnostic.py watch --logs /tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs --state "${RUNNER_TEMP}/provider-diagnostic-v2/intent.json" --receipt "${GITHUB_WORKSPACE}/provider-diagnostic-receipt.json" > "${RUNNER_TEMP}/provider-diagnostic-v2/private-observer.log" 2>&1 &
        observer_pid=$!
        kill -0 "$observer_pid"
        for ((attempt=0; attempt<50; attempt++)); do
          test -f "${RUNNER_TEMP}/provider-diagnostic-v2/intent.ready" && exit 0
          kill -0 "$observer_pid"
          sleep 0.1
        done
        exit 1
    - name: Frozen AWF invocation with version-only finite payload
      id: owned_awf
      timeout-minutes: 15
      shell: bash
      env:
        AWF_REFLECT_ENABLED: 1
        COPILOT_AGENT_RUNNER_TYPE: STANDALONE
        COPILOT_DUMMY_BYOK: dummy-byok-key-for-offline-mode
        COPILOT_GITHUB_TOKEN: ${{ github.token }}
        GH_AW_LLM_PROVIDER: github
        GH_AW_MAX_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_AI_CREDITS || '1000' }}
        GH_AW_TIMEOUT_MINUTES: 15
        GH_AW_VERSION: v0.89.17
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_AW: true
        GITHUB_COPILOT_INTEGRATION_ID: agentic-workflows
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        RUNNER_TEMP: ${{ runner.temp }}
        S2STOKENS: true
        COPILOT_MODEL: gpt-6.1-sol
      run: bash .github/scripts/provider_diagnostic_v2/launch_awf.sh
    - name: Extract selected provider metadata only after AWF returns
      id: extract
      if: ${{ always() && steps.owned_start.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/provider_diagnostic_v2/provider_diagnostic.py finish --logs /tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs --state "${RUNNER_TEMP}/provider-diagnostic-v2/intent.json" --receipt "${GITHUB_WORKSPACE}/provider-diagnostic-receipt.json" --version-file /tmp/gh-aw/provider-diagnostic-version.txt
    - name: Stop MCP Gateway
      if: ${{ always() }}
      env:
        MCP_GATEWAY_PORT: ${{ steps.start-mcp-gateway.outputs.gateway-port }}
        MCP_GATEWAY_AGENT_ID: ${{ steps.start-mcp-gateway.outputs.gateway-agent-id }}
        GATEWAY_PID: ${{ steps.start-mcp-gateway.outputs.gateway-pid }}
      run: |
        { bash "${RUNNER_TEMP}/gh-aw/actions/stop_mcp_gateway.sh" "$GATEWAY_PID"; } > "${RUNNER_TEMP}/provider-diagnostic-v2/private-stop.log" 2>&1
    - name: Upload only sanitized selected-Sol receipt
      if: ${{ always() && (steps.extract.outputs.receipt_written == 'true' || steps.owned_start.outputs.receipt_written == 'true') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: selected-sol-provider-diagnostic
        path: ${{ github.workspace }}/provider-diagnostic-receipt.json
        if-no-files-found: error
        retention-days: 1
