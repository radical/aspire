name: Credential-free pinned gateway startup diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  credential_free_startup:
    if: ${{ github.repository == 'radical/aspire' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
    - name: Setup Scripts
      id: setup
      uses: github/gh-aw-actions/setup@f3b81cdb3070066a47faa9bdf440f4f1dc78b1f0
      with:
        destination: ${{ runner.temp }}/gh-aw/actions
        job-name: ${{ github.job }}
      env:
        GH_AW_SETUP_WORKFLOW_NAME: Selected Sol provider diagnostic
        GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/reproduce-flaky-tests.yml@${{ github.ref }}
        GH_AW_INFO_VERSION: 1.0.85
        GH_AW_INFO_AWF_VERSION: v0.28.20
        GH_AW_INFO_ENGINE_ID: copilot
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run bounded credential-free pinned startup
      id: startup
      shell: python3 -I {0}
      run: 'import runpy

        runpy.run_path(''.github/scripts/provider_diagnostic_v2/credential_free_startup.py'', run_name=''__main__'')

        '
    - name: Recheck exact fresh output eligibility
      id: eligibility
      if: ${{ always() && steps.startup.outputs.eligible == 'true' }}
      shell: python3 -I {0}
      run: 'import runpy

        import sys

        sys.argv = [''credential_free_startup.py'', ''--eligible'']

        runpy.run_path(''.github/scripts/provider_diagnostic_v2/credential_free_startup.py'', run_name=''__main__'')

        '
    - name: Upload only three credential-free diagnostic files
      if: ${{ always() && steps.startup.outputs.eligible == 'true' && steps.eligibility.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: credential-free-gateway-startup
        if-no-files-found: error
        retention-days: 1
        path: '${{ runner.temp }}/credential-free-gateway-startup/stdout.log

          ${{ runner.temp }}/credential-free-gateway-startup/stderr.log

          ${{ runner.temp }}/credential-free-gateway-startup/receipt.json'
