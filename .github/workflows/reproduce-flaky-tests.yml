  validation:
    name: Operator v18 Ubuntu baseline ${{ matrix.machine }}
    if: github.repository == 'radical/aspire' && github.ref == 'refs/heads/ankj/flaky-21424-v18-baseline' && github.run_attempt
      == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        machine:
        - 1
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: 63c361dd3b0b32d55ab7c2276a660a8fd02dd127
      PLAN_ID: pr-21424-v18-baseline
      MACHINE_INDEX: ${{ matrix.machine }}
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      MSBUILDTERMINALLOGGER: 'false'
      ADMISSION_DISPATCHED_AT: ${{ inputs.dispatched_at }}
    steps:
    - name: Record environment and frozen inventory without secrets
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: |
        $env:EVIDENCE = Join-Path $env:RUNNER_TEMP "pr21424-v18-baseline-$env:MACHINE_INDEX"
        "EVIDENCE=$env:EVIDENCE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null
        Copy-Item /etc/os-release "$env:EVIDENCE/os-release"
        $os = @{}
        foreach ($line in Get-Content /etc/os-release) {
          if ($line -match '^([A-Z_]+)=(.*)$') { $os[$Matches[1]] = $Matches[2].Trim('"') }
        }
        @{
          plan = $env:PLAN_ID
          machine = [int]$env:MACHINE_INDEX
          workflowSha = $env:GITHUB_SHA
          workflowRef = $env:GITHUB_WORKFLOW_REF
          workspace = $env:GITHUB_WORKSPACE
          requestedSource = $env:SOURCE_SHA
          admissionDispatchedAt = $env:ADMISSION_DISPATCHED_AT
          runId = $env:GITHUB_RUN_ID
          runAttempt = $env:GITHUB_RUN_ATTEMPT
          job = $env:GITHUB_JOB
          runnerName = $env:RUNNER_NAME
          runnerEnvironment = $env:RUNNER_ENVIRONMENT
          runnerOS = $env:RUNNER_OS
          runnerArch = $env:RUNNER_ARCH
          runnerContext = ($env:RUNNER_CONTEXT | ConvertFrom-Json)
          environmentImageOS = $env:ImageOS
          environmentImageVersion = $env:ImageVersion
          ubuntuId = $os['ID']
          ubuntuVersion = $os['VERSION_ID']
          osDescription = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          processors = [Environment]::ProcessorCount
          recordedAt = [DateTimeOffset]::UtcNow.ToString('O')
