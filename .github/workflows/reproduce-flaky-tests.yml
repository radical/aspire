name: Trusted baseline execution proof (fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-baseline:
    if: github.repository == 'radical/aspire'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact reviewed vendor SDK archive
        shell: bash
        run: |
          curl --disable --fail --silent --show-error --location \
            --max-time 180 --max-filesize 207623687 \
            --output "$RUNNER_TEMP/baseline-sdk.tar.gz" \
            https://builds.dotnet.microsoft.com/dotnet/Sdk/11.0.100-rc.1.26425.128/dotnet-sdk-11.0.100-rc.1.26425.128-linux-x64.tar.gz
      - name: Prepare and run only the fixed trusted baseline
        shell: bash
        run: |
          python3 .github/scripts/flaky_investigation/baseline.py run \
            --sdk-archive "$RUNNER_TEMP/baseline-sdk.tar.gz" \
            --output "$RUNNER_TEMP/aspire-trusted-baseline"
      - name: Reconcile owned containers from a fresh process
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/aspire-trusted-baseline" ]]; then
            python3 .github/scripts/flaky_investigation/baseline.py cleanup \
              --output "$RUNNER_TEMP/aspire-trusted-baseline"
          else
            echo 'No baseline output directory was created.'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trusted-baseline-proof
          path: |
            ${{ runner.temp }}/aspire-trusted-baseline/*.json
            ${{ runner.temp }}/aspire-trusted-baseline/*.cid
            ${{ runner.temp }}/aspire-trusted-baseline/imported/
          if-no-files-found: warn
