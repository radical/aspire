name: Deliberately hung investigation worker (fork only)
run-name: Hung child fixture ${{ inputs.state_revision || inputs.investigation_revision }}
on:
  workflow_dispatch:
    inputs:
      issue_url:
        type: string
        required: false
      issue_number:
        type: string
        required: false
      state_revision:
        type: string
        required: false
      investigation_issue_url:
        type: string
        required: false
      investigation_revision:
        type: string
        required: false
permissions:
  contents: read
jobs:
  deliberate-hang:
    if: github.repository == 'radical/aspire'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remain unresponsive until the owned run is cancelled
        run: python3 .github/scripts/flaky-investigation-hung-worker.py
