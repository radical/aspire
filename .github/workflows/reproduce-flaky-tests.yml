# One closed v1.8 arm; one fresh job and suite; no retries/replacements or extra phases.
# Native commands: 63c361dd3b0b32d55ab7c2276a660a8fd02dd127 .github/workflows/run-tests.yml.
# Scripts/inventory are compressed only to keep the single publication file self-contained.
name: PR 21426 v1.8 existing-fix validation
run-name: Operator v18 Windows baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    name: Operator v18 Windows baseline
    if: github.repository == 'radical/aspire' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ankj/flaky-21426-v18-baseline'
      && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        machine:
        - 1
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: 63c361dd3b0b32d55ab7c2276a660a8fd02dd127
      SOURCE_TREE: 672cda2298acdc162c2375ebb5950e0905ff0f50
      PLAN_ID: pr-21426-v18-baseline
      MACHINE_INDEX: ${{ matrix.machine }}
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      MSBUILDTERMINALLOGGER: 'false'
    steps:
    - name: Materialize closed source-specific evidence guards
      run: |
        $env:EVIDENCE = Join-Path $env:RUNNER_TEMP "pr21426-v18-baseline-windows-$env:MACHINE_INDEX"
                "EVIDENCE=$env:EVIDENCE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
                New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null
                $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/collector.py")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
        $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/expected-inventory.json")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
        $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/source-guard.ps1")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
        $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/execute-native.ps1")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
        $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/evaluate-native.ps1")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
        $bytes = [Convert]::FromBase64String('')
        $compressed = [System.IO.MemoryStream]::new($bytes, $false)
        $gzip = [System.IO.Compression.GZipStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
        $file = [System.IO.File]::Create("$env:EVIDENCE/deadline-policy.ps1")
        try { $gzip.CopyTo($file) } finally { $file.Dispose(); $gzip.Dispose(); $compressed.Dispose() }
    - name: Record machine, image, workflow and worker provenance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $env:EVIDENCE = Join-Path $env:RUNNER_TEMP "pr21426-v18-baseline-windows-$env:MACHINE_INDEX"
        "EVIDENCE=$env:EVIDENCE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null
        # Preserve the primary dispatch time; queue delay must not reset the budget.
        Invoke-WebRequest -Method Get `
          -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
          -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
          -OutFile "$env:EVIDENCE/dispatch-run.json"
        $dispatch = Get-Content "$env:EVIDENCE/dispatch-run.json" -Raw | ConvertFrom-Json
        if ($dispatch.id.ToString() -ne $env:GITHUB_RUN_ID -or
            $dispatch.head_sha -ne $env:GITHUB_SHA -or $dispatch.run_attempt -ne 1 -or
            $dispatch.event -ne 'workflow_dispatch' -or
            $dispatch.head_branch -ne 'ankj/flaky-21426-v18-baseline' -or
            $dispatch.display_title -ne 'Operator v18 Windows baseline') {
          throw 'Primary dispatch receipt differs from the closed arm.'
        }
        . "$env:EVIDENCE/deadline-policy.ps1"
        $created = [DateTimeOffset]$dispatch.created_at
        $deadline = Get-RunDeadline -CreatedAt $created -Now ([DateTimeOffset]::UtcNow)
        "DISPATCH_CREATED_AT=$($created.ToString('O'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "RUN_DEADLINE_UTC=$($deadline.ToString('O'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        @{
          plan = $env:PLAN_ID
          phase = 'existing-fix-validation-v1.8'
          arm = 'baseline'
          confirmationEligible = $false
          dispatchCreatedAt = $created.ToString('O')
          deadlineUtc = $deadline.ToString('O')
          excludedFromRateAndConfirmation = $true
          machine = [int]$env:MACHINE_INDEX
          workflowSha = $env:GITHUB_SHA
          workflowRef = $env:GITHUB_WORKFLOW_REF
          requestedSource = $env:SOURCE_SHA
          runId = $env:GITHUB_RUN_ID
          runAttempt = $env:GITHUB_RUN_ATTEMPT
          job = $env:GITHUB_JOB
          runnerName = $env:RUNNER_NAME
          runnerEnvironment = $env:RUNNER_ENVIRONMENT
          runnerOS = $env:RUNNER_OS
          runnerArch = $env:RUNNER_ARCH
          environmentImageOS = $env:ImageOS
          environmentImageVersion = $env:ImageVersion
          osDescription = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          computerName = [Environment]::MachineName
          processors = [Environment]::ProcessorCount
          worker = @(Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, StartTime, @{Name='version';Expression={$_.FileVersion}})
          recordedAt = [DateTimeOffset]::UtcNow.ToString('O')
        } | ConvertTo-Json -Depth 6 | Set-Content "$env:EVIDENCE/environment.json"
        # Preserve native image data rather than equate ImageOS aliases with image labels.
        # runner-images Configure-ImageDataFile.ps1 supplies the same Setup job detail.
        Copy-Item 'C:\imagedata.json' "$env:EVIDENCE/imagedata.json"
        if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or
            $env:GITHUB_RUN_ATTEMPT -ne '1' -or
            $env:GITHUB_REF -ne 'refs/heads/ankj/flaky-21426-v18-baseline') {
          throw 'Wrong runner, publication branch, or forbidden rerun attempt.'
        }
        if ([DateTimeOffset]::UtcNow -ge $deadline) {
          throw 'Absolute admission deadline expired; preserve this unexecuted slot.'
        }
        "$env:GITHUB_WORKSPACE/.dotnet" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
        Get-Command python | Select-Object Name, Source, Version |
          ConvertTo-Json | Set-Content "$env:EVIDENCE/python-command.json"
        python --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Checkout immutable arm source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: microsoft/aspire
        ref: 63c361dd3b0b32d55ab7c2276a660a8fd02dd127
        persist-credentials: false
    - name: Authenticate native source and workflow-only publication
      run: |
        & "$env:EVIDENCE/source-guard.ps1" -Phase before
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item global.json "$env:EVIDENCE/global.json"
        Copy-Item eng/Versions.props "$env:EVIDENCE/Versions.props"
        Copy-Item eng/Testing.props "$env:EVIDENCE/Testing.props"
        Copy-Item eng/Testing.targets "$env:EVIDENCE/Testing.targets"
    - name: Restore and build the unchanged ordinary Hosting test project
      run: |
        & "$env:EVIDENCE/execute-native.ps1" -Phase build
        exit $LASTEXITCODE
    - name: Record actual SDK, installed runtimes and test host configuration
      run: |
        & .\dotnet.cmd --info 2>&1 | Tee-Object "$env:EVIDENCE/dotnet-info.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # dotnet.cmd emits bootstrap output; query its restored host directly for one version value.
        $nativeDotnet = Join-Path ((Get-Content artifacts/toolset/sdk.txt -Raw).Trim()) 'dotnet.exe'
        & $nativeDotnet --version | Set-Content "$env:EVIDENCE/sdk-version.txt"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((Get-Content "$env:EVIDENCE/sdk-version.txt" -Raw).Trim() -ne '11.0.100-rc.2.26504.105') {
          throw 'Actual loaded SDK differs from admitted pinned source.'
        }
        & .\dotnet.cmd --list-runtimes 2>&1 | Tee-Object "$env:EVIDENCE/installed-runtimes.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item artifacts/bin/Aspire.Hosting.Tests/Debug/net10.0/Aspire.Hosting.Tests.runtimeconfig.json "$env:EVIDENCE/"
    - name: Evaluate and verify pinned native MtpBaseArgs without another suite
      run: |
        & "$env:EVIDENCE/evaluate-native.ps1"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Shutdown build server as in native Windows lane
      run: |
        & .\dotnet.cmd build-server shutdown 2>&1 | Tee-Object "$env:EVIDENCE/build-server-shutdown.log"
        exit $LASTEXITCODE
    - name: Execute exactly one full ordinary Partition=4 suite
      env:
        ASPIRE__TEST__DCPLOGBASEPATH: ${{ runner.temp }}/pr21426-v18-baseline-windows-${{ matrix.machine }}/testresults/dcp
        PLAYWRIGHT_INSTALLED: 'false'
        TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: netaspireci.azurecr.io
        UseSharedCompilation: 'false'
      run: |
        & "$env:EVIDENCE/execute-native.ps1" -Phase test
        exit $LASTEXITCODE
    - name: Verify actual source after execution
      if: always()
      run: |
        & "$env:EVIDENCE/source-guard.ps1" -Phase after
        exit $LASTEXITCODE
    - name: Retain native build and test diagnostics outside checkout
      if: always()
      run: |
        if (Test-Path artifacts/log) {
          Copy-Item artifacts/log "$env:EVIDENCE/native-logs" -Recurse -Force
        }
        if (Test-Path testresults) {
          Copy-Item testresults "$env:EVIDENCE/native-extra-results" -Recurse -Force
        }
    - name: Guard exact original inventory, target outcomes and evidence receipts
      if: always()
      run: |
        python "$env:EVIDENCE/collector.py" --inventory "$env:EVIDENCE/expected-inventory.json" `
          --slot "$env:EVIDENCE" --machine $env:MACHINE_INDEX --output "$env:EVIDENCE/guard-result.json"
        exit $LASTEXITCODE
    - name: Preserve every planned slot including ordinary failed-test TRX
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr21426-v18-baseline-windows-${{ matrix.machine }}
        path: ${{ env.EVIDENCE }}/
        if-no-files-found: error
        retention-days: 30
