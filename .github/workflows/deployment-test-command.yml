# Trigger deployment tests from PR comments
#
# Usage: Start a PR comment with `/deployment-test` (trailing content must be separated by whitespace)
#
# This workflow validates the commenter has repository write access and triggers
# the deployment-tests.yml workflow with the PR context.
#
name: Deployment Test Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write  # To trigger workflows

jobs:
  deployment-test:
    # Prefilter command candidates; the script below enforces the command-token boundary.
    if: >-
      ${{
        startsWith(github.event.comment.body, '/deployment-test') &&
        github.event.issue.pull_request &&
        github.repository_owner == 'microsoft'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment command scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-test-command
          sparse-checkout: |
            .github/workflows/deployment-test-command
          fetch-depth: 1
          persist-credentials: false

      - name: Check command and repository write access
        id: check_permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('${{ github.workspace }}/.deployment-test-command/.github/workflows/deployment-test-command/check-permission.js');
            await run({ github, context, core });

      - name: Get PR details
        if: steps.check_permission.outputs.has_write_access == 'true'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('${{ github.workspace }}/.deployment-test-command/.github/workflows/deployment-test-command/get-pull-request.js');
            await run({ github, context, core });

      - name: Trigger deployment tests
        if: steps.check_permission.outputs.has_write_access == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const run = require('${{ github.workspace }}/.deployment-test-command/.github/workflows/deployment-test-command/dispatch-deployment-tests.js');
            await run({ github, context, core });
