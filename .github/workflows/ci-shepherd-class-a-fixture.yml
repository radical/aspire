name: CI Shepherd Class A Fixture

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests / QuarantineTools (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Generate attempt-specific TRX
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p fixture-results/ubuntu-latest/testresults
          if [ "$RUN_ATTEMPT" = "1" ]; then
            outcome=Failed
          else
            outcome=Passed
          fi
          cat > fixture-results/ubuntu-latest/testresults/QuarantineTools_net10.0_fixture.trx <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <TestRun xmlns="http://microsoft.com/schemas/VisualStudio/TeamTest/2010">
            <Results>
              <UnitTestResult testId="fixture-test-id" outcome="$outcome" />
            </Results>
            <TestDefinitions>
              <UnitTest id="fixture-test-id">
                <TestMethod className="QuarantineTools.Tests.QuarantineScriptTests" name="QuarantineRoundTripPreservesEncodingAndRawStrings" />
              </UnitTest>
            </TestDefinitions>
          </TestRun>
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-test-results
          path: fixture-results
      - name: Fail only the first attempt
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" -gt 1

  aggregate:
    name: CI Shepherd Fixture / Final Test Results
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fixture-test-results
          path: aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: All-TestResults
          path: aggregate
