name: Known test failures real CI proof

on:
  push:
    branches: [known-test-failure-allowances]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read
  actions: read

jobs:
  gate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(vars.ASPIRE_KNOWN_TEST_FAILURES_PROOF_MATRIX || '[{"os":"ubuntu-latest","scenario":"candidate"}]') }}
    if: >-
      github.repository == 'radical/aspire' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/known-test-failure-allowances') ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == 'radical/aspire' &&
        github.event.pull_request.head.ref == 'known-test-failure-allowances'))
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: ${{ format('Infrastructure.KnownFailures-normal-{0}', contains(fromJson('["pass","candidate","mixed","parameter","changed","crash","empty"]'), matrix.scenario) && matrix.scenario || 'invalid') }}
      testProjectPath: tests/Infrastructure.Tests/Infrastructure.Tests.csproj
      os: ${{ matrix.os }}
      extraTestArgs: ${{ matrix.scenario == 'empty' && '--filter-method "*.NoSuchKnownFailureProofCase" --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"' || '--filter-class "*.KnownFailurePipelineCases" --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"' }}
      knownFailureProof: true
      knownFailureLane: regular
      knownFailureProofScenario: ${{ matrix.scenario }}

  packages:
    if: >-
      vars.ASPIRE_KNOWN_TEST_FAILURES_ARCHIVE_PROOF_MATRIX != '' &&
      github.repository == 'radical/aspire' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/known-test-failure-allowances') ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
        github.event.pull_request.head.repo.full_name == 'radical/aspire' &&
        github.event.pull_request.head.ref == 'known-test-failure-allowances'))
    # Common.projitems repacks downloaded RID binaries without executing them.
    # A single producer avoids blocking every archive lane on macOS capacity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build real proof package artifacts
        shell: pwsh
        run: |
          foreach ($rid in @('linux-x64', 'win-x64', 'osx-arm64')) {
            $ridProject = Join-Path $env:GITHUB_WORKSPACE "eng/dcppack/Aspire.Hosting.Orchestration.$rid.csproj"
            & ./build.sh -restore -build -ci -pack -projects "$ridProject" /p:SkipNativeBuild=true /p:InstallBrowsersForPlaywright=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $managedProject = Join-Path $env:GITHUB_WORKSPACE 'src/Components/Aspire.StackExchange.Redis/Aspire.StackExchange.Redis.csproj'
          & ./build.sh -restore -build -ci -pack -projects "$managedProject" /p:SkipNativeBuild=true /p:InstallBrowsersForPlaywright=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload managed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-nugets
          path: artifacts/packages
          if-no-files-found: error
      - name: Upload Linux RID packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-nugets-for-linux-x64
          path: artifacts/packages/Debug/Shipping/Aspire.Hosting.Orchestration.linux-x64.*.nupkg
          if-no-files-found: error
      - name: Upload Windows RID packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-nugets-for-win-x64
          path: artifacts/packages/Debug/Shipping/Aspire.Hosting.Orchestration.win-x64.*.nupkg
          if-no-files-found: error
      - name: Upload macOS RID packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-nugets-for-osx-arm64
          path: artifacts/packages/Debug/Shipping/Aspire.Hosting.Orchestration.osx-arm64.*.nupkg
          if-no-files-found: error
      - name: Upload package build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: known-failure-package-logs
          path: artifacts/log

  archive_gate:
    needs: packages
    if: vars.ASPIRE_KNOWN_TEST_FAILURES_ARCHIVE_PROOF_MATRIX != ''
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(vars.ASPIRE_KNOWN_TEST_FAILURES_ARCHIVE_PROOF_MATRIX || '[{"os":"ubuntu-latest","scenario":"candidate"}]') }}
    uses: ./.github/workflows/run-tests.yml
    with:
      testShortName: ${{ format('Infrastructure.KnownFailures-archive-{0}', contains(fromJson('["pass","candidate","mixed","parameter","changed","crash","empty"]'), matrix.scenario) && matrix.scenario || 'invalid') }}
      testProjectPath: tests/Infrastructure.Tests/Infrastructure.Tests.csproj
      properties: '{"requiresNugets":true}'
      os: ${{ matrix.os }}
      extraTestArgs: ${{ matrix.scenario == 'empty' && '--filter-method "*.NoSuchKnownFailureProofCase" --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"' || '--filter-class "*.KnownFailurePipelineCases" --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"' }}
      knownFailureProof: true
      knownFailureLane: regular
      knownFailureProofScenario: ${{ matrix.scenario }}
