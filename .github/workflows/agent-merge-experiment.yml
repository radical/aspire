name: Agent Merge experiment fixture

on:
  pull_request:
    paths:
      - ".agent-merge-experiment/**"

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run normalization fixture tests
        run: python3 -m unittest discover -s .agent-merge-experiment -p "test_*.py" -v
